          - {fecha_datos: "2026-11-26", id_producto: "8", cadena: Dia, empresa: "15", formato: supermercado, precio_mediano: 2100, precio_minimo: 2100, precio_maximo: 2100, sucursales: 900, cantidad_normalizada: 900, unidad_normalizada: cc}
          - {fecha_datos: "2026-11-26", id_producto: "8", cadena: Coto, empresa: "12", formato: supermercado, precio_mediano: 2200, precio_minimo: 2200, precio_maximo: 2200, sucursales: 100, cantidad_normalizada: 900, unidad_normalizada: cc}
          - {fecha_datos: "2026-11-26", id_producto: "8", cadena: Jumbo, empresa: "9", formato: supermercado, precio_mediano: 2300, precio_minimo: 2300, precio_maximo: 2300, sucursales: 50, cantidad_normalizada: 900, unidad_normalizada: cc}
      - input: ref('stg_categorias')
        rows:
          - {id_producto: "8", descripcion: LIMPIADOR 900ML, marca: GIGANTE, categoria: Limpieza, rubro: Limpieza}
      - input: source('sepa', 'productos')
        rows: []
    expect:
      rows:
        - {cadena: Basualdo, precio_en_rango: false, precio_creible: false, es_el_mas_barato: false}
        - {cadena: Dia, precio_en_rango: true, precio_creible: true, es_el_mas_barato: true}
        - {cadena: Coto, precio_en_rango: true, precio_creible: true, es_el_mas_barato: false}
        - {cadena: Jumbo, precio_en_rango: true, precio_creible: true, es_el_mas_barato: false}
