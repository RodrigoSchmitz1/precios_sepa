# Tests en cada push y pull request.
#
# Hasta el 2026-09-24 los tests solo corrian a mano. Este workflow no toca
# BigQuery ni Gemini: la API corre con SIN_BIGQUERY=1 (credenciales anonimas,
# ver api/main.py) y ningun test consulta nada, asi que no consume cuota ni
# necesita secretos.

name: Tests

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # la misma de la imagen (Dockerfile)
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Tests de la API
        run: python -m unittest discover -p "test_*.py" -v
        env:
          SIN_BIGQUERY: "1"

  ingesta:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orquestacion/scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: orquestacion/requirements.txt
      - run: pip install -r ../requirements.txt
      - name: Tests de la ingesta
        run: python -m unittest test_ingesta_backfill test_hay_que_transformar -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"  # la misma de la imagen (Dockerfile)
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Tipos y build
        run: npm run build
