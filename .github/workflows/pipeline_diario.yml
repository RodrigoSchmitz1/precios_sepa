# Transformacion diaria en la nube.
#
# La DESCARGA de SEPA no esta aca: el portal (datos.produccion.gob.ar) bloquea
# con 403 los rangos de IP de GitHub Actions y de Google, verificado el
# 2026-09-06 (ver el workflow diagnostico_sepa.yml). Esa parte corre en la
# maquina de Rodrigo via ingesta_backfill.py + Task Scheduler, que es la unica
# IP que el portal acepta. Todo lo demas habla solo con BigQuery y Gemini, que
# desde Actions funcionan sin problema.
#
# Como la ingesta local es auto-reparable, este workflow no necesita saber si
# hoy entraron datos nuevos: dbt recalcula las fechas que haya en el crudo y
# insert_overwrite reemplaza solo esas particiones. Correrlo de mas es inocuo.

name: Transformacion diaria (dbt)

on:
  schedule:
    - cron: "0 11 * * *"  # 11:00 UTC = 08:00 ART, una hora despues de la ingesta local
  workflow_dispatch: {}

jobs:
  transformar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orquestacion/scripts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install -r ../requirements.txt
          pip install "dbt-bigquery~=1.11.0"

      - name: Escribir credenciales de BigQuery
        run: echo "$GCP_SA_KEY" > credenciales.json
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

      - name: Categorizar productos nuevos (Gemini)
        run: python categorizar.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Escribir profiles.yml de dbt
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<EOF
          precios_sepa:
            target: dev
            outputs:
              dev:
                type: bigquery
                method: service-account
                project: proyecto-precios-504221
                dataset: dbt_precios
                location: US
                keyfile: ${{ github.workspace }}/orquestacion/scripts/credenciales.json
                threads: 4
                timeout_seconds: 300
                priority: interactive
          EOF

      # NUNCA agregar --full-refresh: reconstruiria los historicos desde cero y
      # borraria toda la historia acumulada, que no se puede recuperar porque el
      # crudo retiene solo 3 dias.
      - name: dbt run
        working-directory: .
        run: dbt run

      - name: Capturar log de cambios de dimensiones
        run: python capturar_log.py

      - name: Limpiar credenciales
        if: always()
        run: rm -f credenciales.json
