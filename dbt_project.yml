
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'precios_sepa'
version: '1.0.0'
config-version: 2

profile: 'precios_sepa'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"  # directory which will store compiled SQL files
clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


# Capas del proyecto:
#   staging/    limpieza y tipado de las fuentes crudas de SEPA, sin logica de negocio
#   intermedios/ calculos que comparten varios marts, para pagar el escaneo una sola vez
#   marts/      KPIs y tablas que consume la API (foto actual, se reconstruyen enteras)
#   historicos/ acumulacion incremental de los KPIs; es la unica data irrecuperable
#               del proyecto, porque el crudo solo retiene 3 dias.
#
# Los modelos de historicos/ declaran su propia config (incremental +
# insert_overwrite + particion sin expiracion) en cada archivo, para que la
# regla de "nunca --full-refresh" quede visible junto al SQL.

# Validacion de promos por evidencia (2026-09-10; umbrales fijos desde el 09-11).
#
# Reemplaza al tope de 70% igual para todas las cadenas: el analisis esta en el
# encabezado de mart_promos_evidencia. Umbrales medidos sobre las promos
# verificadas por leyenda del 2026-09-09:
#
# - promos_piso_cociente_mercado: percentil 0,1 de precio promo / lista mas
#   barata del mismo producto en otra empresa, entre 805.041 verificadas: 0,519.
# - promos_techo_descuento_sin_verificar: percentil 99,9 del descuento de 965.175
#   verificadas: 50.
# - promos_descuento_maximo_mercado: la verificada mas agresiva: 70.
#
# Son FIJOS porque esas colas no son estables. El 2026-09-10 Dia paso de 224 a
# 4.069 verificadas por encima de 50%: el P99,9 salto a 74,3 y el P0,1 bajo a
# 0,339, y recalculados ese dia dejaban a Carrefour con 17.283 filas de 50% o mas,
# mas que el tope viejo. Con estos valores fijos fueron 1.812 el 09-09 y 1.799 el
# 09-10. mart_promos_calibracion sigue midiendo las colas para vigilarlas.
#
# - promos_muestra_minima: por debajo de esta cantidad de promos verificadas en
#   un dia, calibracion_de_promos_con_muestra_suficiente avisa.
vars:
  promos_piso_cociente_mercado: 0.519
  promos_techo_descuento_sin_verificar: 50
  promos_descuento_maximo_mercado: 70
  promos_muestra_minima: 10000

  # El mismo producto: cuando el precio de una cadena se aparta tanto de la
  # mediana ENTRE EMPRESAS, deja de ser una diferencia de precio y pasa a ser un
  # dato mal cargado. Esos precios no entran en el calculo de la brecha, aunque
  # se siguen mostrando marcados.
  #
  # Calibrado el 2026-09-22 sobre los 10.467 productos con 3+ empresas del mart.
  # La dispersion real es estrecha: el minimo esta en 0,92 de la referencia en la
  # mediana y en 0,573 en el percentil 1; el maximo, en 1,073 y 1,421. Con estos
  # umbrales se descartan 51 precios por abajo (0,49%) y 8 por arriba (0,08%):
  # solo la cola imposible, por fuera del percentil 1 y del 99.
  #
  # La referencia se calcula entre empresas y no entre banderas a proposito: con
  # banderas, Carrefour pesa cuatro veces y Cencosud tres, asi que la "mediana
  # del mercado" seria la mediana de dos empresas.
  # Cuantas de las categorias de la canasta basica se pueden valuar con la
  # mediana de la provincia cuando la localidad no junta datos. La medicion que
  # lo justifica esta en mart_canasta_detalle.
  canasta_maximo_imputadas: 4
  # Categorias que se cotizan por pieza y donde las cadenas suelen cargar el
  # paquete entero como "1 unidad". Ver el macro piezas_por_envase.
  categorias_por_pieza: ["Huevos", "Panales", "Higiene bebe", "Descartables"]
  mismo_producto_piso_creible: 0.5
  mismo_producto_techo_creible: 2.0
  # Un precio fuera de ese rango igual cuenta si otro esta a menos de este
  # porcentaje (de otra empresa, o de la misma pero en rango). Medido el
  # 2026-09-23 sobre los 79 descartes: con 5% no rescata ninguno, con 10% 7,
  # con 15% 8 y con 20% 11. Los 7 del 10% se revisaron uno por uno y se ven
  # reales (Changomas vs Carrefour a $1.590/$1.695, Vea vs Jumbo, La Anonima vs
  # Maxi). Se queda en 10: lo mas estricto que alcanza para esos casos.
  mismo_producto_tolerancia_coincidencia: 0.10

  # Minimo de productos para que una sucursal tenga precio en una combinacion
  # categoria x gama x unidad (mart_precio_categoria_sucursal). Es mas bajo que
  # las 10 muestras del mart por localidad porque una sucursal ofrece decenas de
  # productos por categoria, no miles. Con 3, la mediana ya resiste un precio
  # suelto mal cargado. A calibrar cuando se mida la cobertura real por radio.
  muestras_minimas_sucursal: 3

models:
  precios_sepa:
    staging:
      +materialized: table
    marts:
      +materialized: table
