
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'precios_sepa'
version: '1.0.0'
config-version: 2

profile: 'precios_sepa'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"  # directory which will store compiled SQL files
clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


# Capas del proyecto:
#   staging/    limpieza y tipado de las fuentes crudas de SEPA, sin logica de negocio
#   marts/      KPIs y tablas que consume la API (foto actual, se reconstruyen enteras)
#   historicos/ acumulacion incremental de los KPIs; es la unica data irrecuperable
#               del proyecto, porque el crudo solo retiene 3 dias.
#
# Los modelos de historicos/ declaran su propia config (incremental +
# insert_overwrite + particion sin expiracion) en cada archivo, para que la
# regla de "nunca --full-refresh" quede visible junto al SQL.

# Validacion de promos por evidencia (2026-09-10).
#
# Reemplaza al tope fijo de 70% que habia hasta entonces: el analisis esta en el
# encabezado de mart_promos_evidencia. Los umbrales se calibran cada dia en
# mart_promos_calibracion con las promos cuya leyenda confirma el descuento.
# Estos son solo los valores de RESPALDO para un dia con pocas promos
# verificadas, medidos sobre el 2026-09-09:
#
# - promos_piso_cociente_respaldo: percentil 0,1 de precio promo / lista mas
#   barata del mismo producto en otra empresa, entre 805.041 promos
#   verificadas: 0,519.
# - promos_techo_descuento_respaldo: percentil 99,9 del descuento de 965.175
#   promos verificadas: 50.
# - promos_muestra_minima: por debajo de esta cantidad de promos verificadas se
#   usa el respaldo en vez de la calibracion del dia. Un dia normal tiene
#   cientos de miles; 10.000 solo se incumple si algo se rompio en la carga.
vars:
  promos_piso_cociente_respaldo: 0.519
  promos_techo_descuento_respaldo: 50
  promos_muestra_minima: 10000

models:
  precios_sepa:
    staging:
      +materialized: table
    marts:
      +materialized: table
